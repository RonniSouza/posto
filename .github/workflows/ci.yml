name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Posto.slnx
      - run: dotnet build Posto.slnx --no-restore -c Release
      - run: dotnet test Posto.slnx --no-build -c Release
